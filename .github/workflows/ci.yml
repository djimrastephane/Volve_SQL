name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  sql-lint:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sqlfluff==4.3.0
      - run: sqlfluff lint sql/

  sql-schema-apply:
    name: Apply schema to PostgreSQL (dry run, no data)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      # sql/07_app_role.sql grants against a database literally named
      # volve_analytics (matching VOLVE_DB_NAME's default everywhere else
      # in this project - app/db.py, src/load_postgres.py), not whatever
      # database happens to be current - so that database has to actually
      # exist first, or that GRANT fails with "database does not exist".
      - name: Create volve_analytics database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE volve_analytics"
      # Applies every sql/NN_*.sql file in order against a fresh, empty
      # database - the raw Excel source data is licensed and not
      # redistributed (see data/README.md), so this validates that the
      # schema/views/checks/role-grants all apply cleanly end-to-end, not
      # that the data-dependent contents of 04_quality_checks.sql pass.
      - name: Apply sql/*.sql in order
        env:
          PGPASSWORD: postgres
        run: |
          for f in sql/01_create_schemas.sql sql/02_create_tables.sql \
                   sql/03_create_indexes.sql sql/04_quality_checks.sql \
                   sql/05_views.sql sql/06_analysis.sql sql/07_app_role.sql; do
            echo "::group::$f"
            psql -h localhost -U postgres -d volve_analytics -v ON_ERROR_STOP=1 -f "$f"
            echo "::endgroup::"
          done

  loader-fixture-test:
    name: Load synthetic fixture through the real pipeline
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    # sql-schema-apply above only proves the DDL applies to an empty
    # database - src/load_postgres.py, and the data-dependent contents of
    # 04_quality_checks.sql/06_analysis.sql, were never actually exercised
    # by CI, since the real Volve workbook is licensed and not
    # redistributed (data/README.md). This job runs the real loader
    # against tests/fixtures/generate_sample_workbook.py's tiny synthetic
    # stand-in instead, so a loader or transform regression - a broken
    # column mapping, a stray-row-exclusion bug, a reconciliation query
    # that no longer runs - gets caught here, not on the next real load.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # sql/07_app_role.sql grants against a database literally named
      # volve_analytics (matching VOLVE_DB_NAME's default everywhere else
      # in this project), not whatever database happens to be current -
      # so that database has to actually exist first, or that GRANT fails.
      - name: Create volve_analytics database
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE volve_analytics"
      - name: Apply schema/views/role (skip 04 - runs after data exists below)
        env:
          PGPASSWORD: postgres
        run: |
          for f in sql/01_create_schemas.sql sql/02_create_tables.sql \
                   sql/03_create_indexes.sql sql/05_views.sql sql/07_app_role.sql; do
            psql -h localhost -U postgres -d volve_analytics -v ON_ERROR_STOP=1 -f "$f"
          done
      # sql/07_app_role.sql deliberately creates volve_app with no
      # password, since local Homebrew Postgres (this project's actual
      # dev environment) uses trust auth for local connections - see that
      # file's own comment. The official postgres:17 image this job uses
      # requires password auth for every role, with no exception, so
      # volve_app needs one here to be connectable at all. Matches the
      # same PGPASSWORD used everywhere else in this job for simplicity;
      # psycopg2/libpq picks it up automatically for any connection that
      # doesn't pass an explicit password (app/db.py and tests/conftest.py
      # both connect as volve_app this way), so nothing else changes.
      - name: Set a password for volve_app (CI only - see comment)
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d volve_analytics -v ON_ERROR_STOP=1 -c "ALTER ROLE volve_app WITH PASSWORD 'postgres'"
      - name: Generate the synthetic fixture
        run: python tests/fixtures/generate_sample_workbook.py /tmp/sample_workbook.xlsx
      - name: Load the fixture through src/load_postgres.py
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          VOLVE_DB_NAME: volve_analytics
          VOLVE_WORKBOOK_PATH: /tmp/sample_workbook.xlsx
          # The fixture's own known row/wellbore counts - see
          # tests/fixtures/generate_sample_workbook.py's docstring. The
          # real snapshot's counts (15,634 / 7) remain the script's
          # default when these are unset.
          VOLVE_EXPECTED_DAILY_ROWS: "20"
          VOLVE_EXPECTED_WELLBORE_COUNT: "2"
        run: python src/load_postgres.py
      # Proves these scripts execute cleanly against real (if synthetic)
      # data - not that every check reports PASS. Most of 04's DQ-00X
      # checks compare against the real dataset's exact known exception
      # counts (e.g. "244 pre-2008 rows"), which this fixture was never
      # meant to reproduce - see its docstring. ON_ERROR_STOP only fails
      # this step on an actual SQL error, not on a query legitimately
      # returning a FAIL/REVIEW row.
      - name: Run quality checks and analysis queries against the loaded data
        env:
          PGPASSWORD: postgres
        run: |
          psql -h localhost -U postgres -d volve_analytics -v ON_ERROR_STOP=1 -f sql/04_quality_checks.sql
          psql -h localhost -U postgres -d volve_analytics -v ON_ERROR_STOP=1 -f sql/06_analysis.sql
      # Reuses this same database - it's already loaded with the fixture
      # and has the volve_app role from the schema step above, exactly
      # what tests/conftest.py's fixtures need. See tests/conftest.py's
      # module docstring: pytest doesn't orchestrate the load itself.
      - name: Run pytest suite
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          VOLVE_DB_NAME: volve_analytics
        run: pytest tests/ -v

  python-syntax:
    name: Python syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No test suite exists yet - this is a cheap floor, not a substitute
      # for one: catches a syntax error before it reaches main, nothing more.
      - run: python -m py_compile app/*.py app/views/*.py src/*.py
